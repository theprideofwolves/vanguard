name: Test and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Record functional, fuzz, coverage and benchmark evidence
        run: python .github/scripts/verify.py --output verification/${{ runner.os }} --fuzz-seconds 10 --benchmark-count 3 --benchmark-time 250ms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: verification/${{ runner.os }}/
      - run: go build -trimpath -o dist/vanguard${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/vanguard
      - uses: actions/upload-artifact@v4
        with:
          name: vanguard-${{ runner.os }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Package portable releases
        run: |
          mkdir -p release
          for os in windows linux; do
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "package-$os"
            GOOS=$os GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "package-$os/vanguard$ext" ./cmd/vanguard
            go version -m "package-$os/vanguard$ext" > "package-$os/dependencies.txt"
            cp README.md RELEASE.md TESTING.md architecture.md interviewprep.md explaining-each-decision-taken-over-others.md "package-$os/"
            cp policy.yaml "package-$os/"
            mkdir -p "package-$os/testdata" "package-$os/examples"
            cp -r testdata/impact "package-$os/testdata/"
            cp testdata/report-pass.json testdata/report-fail.json "package-$os/testdata/"
            cp examples/github-action.yml examples/github-policy-review.yml examples/policy-review.md "package-$os/examples/"
            (cd "package-$os" && zip -r "../release/vanguard-$os-x64.zip" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "Vanguard $tag" --notes-file RELEASE.md
